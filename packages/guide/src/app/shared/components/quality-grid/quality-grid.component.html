@if (!showOnlyBase()) {

    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.BASE"/>
    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.BRONZE"/>
    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.SILVER"/>
    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.GOLD"/>
    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.OSMIUM"/>
    @if (includePrices()) {

        <app-money [amount]="item().sellPrice" class="text-black"/>
        <app-money [amount]="$safeNavigationMigration(item().qualities.bronze?.sellPrice)" class="text-black"/>
        <app-money [amount]="$safeNavigationMigration(item().qualities.silver?.sellPrice)" class="text-black"/>
        <app-money [amount]="$safeNavigationMigration(item().qualities.gold?.sellPrice)" class="text-black"/>
        <app-money [amount]="$safeNavigationMigration(item().qualities.osmium?.sellPrice)" class="text-black"/>

    }

}
@if (showOnlyBase()) {

    <app-item-icon [itemName]="item().iconName" [quality]="QUALITY.BASE"/>
    @if (includePrices()) {
        <app-money [amount]="item().sellPrice" class="text-black"/>
    }

}
