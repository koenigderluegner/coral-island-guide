@if (isInMusuemChecklist()) {
    <button (click)="toggle('museum')" [class.text-[#D1CAC0]]="!isActive('museum')">
        Donated
        <div class="flex items-center justify-center p-2 text-[#D1CAC0]"
             [class.bg-[#9ABF71]]="isActive('museum')" [class.bg-[#EDE6DB]]="!isActive('museum')"
             [class.text-[#5D7443]]="isActive('museum')" [class.text-[#D1CAC0]]="!isActive('museum')">
            <app-ui-icon class="!size-6" [uiIcon]="UiIcon.MUSEUM"/>
        </div>
    </button>
}
